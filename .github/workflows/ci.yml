name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Backend Verification
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Test Suite (Pytest)
        run: |
          pytest tests/

      - name: Verify Serverless API Entrypoint
        run: |
          python -c "from api.index import app; from fastapi.testclient import TestClient; c = TestClient(app); assert c.get('/api/health').status_code == 200; print('Serverless health check passed!')"

      # 2. Frontend Verification
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Production Frontend Build Script
        run: |
          bash build.sh

      - name: Verify Built Assets
        run: |
          test -f frontend/dist/index.html
          test -f public/index.html
          echo "Frontend build artifacts verified successfully!"
